name: Database migrations

# Applies the files in supabase/migrations to the cloud databases.
# Staging first. Production waits for a person to approve it in GitHub.
on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
  workflow_dispatch:

# One run at a time, and never cancel one halfway through a migration.
concurrency:
  group: migrations
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  staging:
    name: Staging
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v7

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link to the project
        run: supabase link --project-ref "$PROJECT_REF"

      - name: Show what will run
        run: supabase db push --dry-run

      - name: Apply
        run: supabase db push

  production:
    name: Production
    needs: staging
    # Turned on with a repository variable once a production project exists.
    if: vars.PRODUCTION_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Add required reviewers to this environment so a person approves each run.
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v7

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link to the project
        run: supabase link --project-ref "$PROJECT_REF"

      - name: Show what will run
        run: supabase db push --dry-run

      - name: Apply
        run: supabase db push
